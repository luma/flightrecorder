name: flightrecorder

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flightrecorder
      POSTGRES_PASSWORD: flightrecorder
      POSTGRES_DB: flightrecorder
    ports:
      - "5432:5432"
    volumes:
      - flightrecorder-postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightrecorder -d flightrecorder"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  flightrecorder-postgres-data:
